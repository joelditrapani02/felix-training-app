<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Felix Training Engine</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --text: #e8e8f0;
      --muted: #888899;
      --accent: #b073d8;
      --accent-dim: rgba(176,115,216,0.15);
      --accent-glow: rgba(176,115,216,0.35);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --yellow: #fbbf24;
      --yellow-dim: rgba(251,191,36,0.12);
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.12);
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      /* iOS safe areas */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── HEADER ── */
    .header {
      padding: 32px 24px 24px;
      max-width: 680px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: var(--accent-dim);
      border: 1px solid rgba(176,115,216,0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    /* ── PROGRESS ── */
    .progress-bar {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 24px;
    }

    .progress-track {
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── QUESTION CARD ── */
    .card-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 32px;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .card-emoji { font-size: 20px; }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .card-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(176,115,216,0.2);
    }

    .question-text {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }

    .question-text em {
      color: var(--muted);
      font-style: normal;
      font-size: 14px;
    }

    blockquote {
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      margin: 12px 0;
      background: var(--accent-dim);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 14px;
      color: #ccc;
      font-style: italic;
    }

    /* ── SCALE ── */
    .scale-container {
      margin-bottom: 20px;
    }

    .scale-track {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .scale-btn {
      flex: 1;
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scale-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .scale-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: scale(1.05);
    }

    .scale-btn[data-v="1"].selected,
    .scale-btn[data-v="2"].selected,
    .scale-btn[data-v="3"].selected {
      background: var(--red);
      border-color: var(--red);
    }

    .scale-btn[data-v="4"].selected,
    .scale-btn[data-v="5"].selected,
    .scale-btn[data-v="6"].selected {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #111;
    }

    .scale-btn[data-v="7"].selected,
    .scale-btn[data-v="8"].selected,
    .scale-btn[data-v="9"].selected,
    .scale-btn[data-v="10"].selected {
      background: var(--green);
      border-color: var(--green);
      color: #111;
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── MULTI CHOICE ── */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      color: var(--text);
      font-size: 14px;
    }

    .option-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .option-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      min-width: 18px;
      transition: color 0.15s;
    }

    .option-btn.selected .option-num {
      color: var(--accent);
    }

    /* ── TEXT INPUT ── */
    .text-input-wrap {
      margin-bottom: 8px;
    }

    .text-input-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      padding: 12px;
      resize: vertical;
      min-height: 72px;
      font-family: inherit;
      line-height: 1.5;
      transition: border-color 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    /* ── ACTIONS ── */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      align-items: center;
    }

    .btn-skip {
      padding: 10px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-skip:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--text);
    }

    .btn-next {
      flex: 1;
      padding: 12px 24px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-next:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-more {
      padding: 10px 18px;
      background: transparent;
      border: 1px solid rgba(176,115,216,0.3);
      border-radius: var(--radius-sm);
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-more:hover {
      background: var(--accent-dim);
    }

    /* ── COMPLETION ── */
    .completion {
      display: none;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
    }

    .completion.show { display: block; }

    .completion-icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .completion h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .completion p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }

    .completion-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
    }

    .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 12px;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .submit-hint {
      font-size: 12px;
      color: var(--muted);
    }

    /* ── STREAK / GAMIFICATION ── */
    .streak-bar {
      max-width: 680px;
      margin: 0 auto 0;
      padding: 0 24px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .streak-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface2);
      transition: background 0.3s;
    }

    .streak-dot.done { background: var(--accent); }
    .streak-dot.current { background: var(--yellow); }

    .streak-label {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ── SUCCESS TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green);
      color: #111;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">🧠</div>
    <div>
      <h1>Felix Training Engine</h1>
      <div class="subtitle">Daily review · makes Felix smarter</div>
    </div>
  </div>
</div>

<div class="streak-bar" id="streakBar"></div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label">
    <span id="progressText">Question 1 of 5</span>
    <span id="progressPct">0%</span>
  </div>
</div>

<div class="card-container" id="cardContainer"></div>

<div class="completion" id="completion">
  <div class="completion-icon">🎯</div>
  <h2>Session complete</h2>
  <p id="completionSub">Your feedback trains Felix to work better for you.</p>
  <div class="completion-stats">
    <div class="stat-box">
      <div class="stat-num" id="statAnswered">0</div>
      <div class="stat-label">answered</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statAvgRating">—</div>
      <div class="stat-label">avg Felix rating</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statSignals">0</div>
      <div class="stat-label">signals captured</div>
    </div>
  </div>
  <button class="btn-submit" id="btnSubmit" onclick="submitSession()">Apply to Felix →</button>
  <div class="submit-hint">This saves your responses and updates Felix's rules</div>
</div>

<div class="toast" id="toast">✓ Applied to Felix</div>

  ]
};

// ── TELEGRAM WEBAPP INTEGRATION ─────────────────────────────────────────
const tg = window.Telegram?.WebApp;

function tgInit() {
  if (!tg) return;
  tg.ready();
  tg.expand();

  // Apply Telegram theme colours
  const root = document.documentElement;
  if (tg.colorScheme === 'light') {
    root.style.setProperty('--bg', '#f5f5f5');
    root.style.setProperty('--surface', '#ffffff');
    root.style.setProperty('--surface2', '#f0f0f0');
    root.style.setProperty('--text', '#111111');
    root.style.setProperty('--muted', '#666666');
    root.style.setProperty('--border', 'rgba(0,0,0,0.1)');
  }

  // Show main button when there are responses
  tg.MainButton.setText('Apply to Felix →');
  tg.MainButton.hide();
  tg.MainButton.onClick(() => submitSession());
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  tgInit();

  // Try to restore today's local session
  // Always fetch today.json first — if session_id differs from cache, use fresh version
  try {
    const resp = await fetch(`./today.json?t=${Date.now()}`, { cache: 'no-store' });
    if (resp.ok) {
      const session = await resp.json();
      if (session.questions?.length > 0) {
        // Check if we have a matching saved session (same id, not submitted)
        const saved = localStorage.getItem(SESSION_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.sessionId === session.session_id && !parsed.submitted) {
              state = parsed;
              render();
              return;
            }
          } catch(e) {}
        }
        // Load fresh session from server
        state.sessionId = session.session_id;
        state.questions = session.questions.map((q,i) => ({...q, number: i+1}));
        state.responses = {};
        saveState();
        render();
        return;
      }
    }
  } catch(e) { /* offline — fall through to cache or local pool */ }

  // Try cached session
  const saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.date === state.date && !parsed.submitted) {
        state = parsed;
        render();
        return;
      }
    } catch(e) {}
  }

  // Fallback: generate from local pool
  generateSession(5);
}

function generateSession(count) {
  state.sessionId = state.date + '-' + Math.floor(Math.random() * 9000 + 1000);
  state.questions = pickQuestions(count);
  state.current = 0;
  state.responses = {};
  saveState();
  render();
}

function pickQuestions(n) {
  const categories = ['felix_review', 'felix_review', 'felix_review', 'writing_style', 'joel_modeling', 'creative'];
  const selected = [];
  const usedIds = new Set();

  // Always get some felix questions first
  const felixPool = [...QUESTION_POOL.felix_review];
  shuffle(felixPool);
  for (const q of felixPool) {
    if (selected.length >= 3) break;
    if (!usedIds.has(q.id)) { selected.push(q); usedIds.add(q.id); }
  }

  // Then fill from other categories
  const others = [
    ...QUESTION_POOL.writing_style,
    ...QUESTION_POOL.joel_modeling,
    ...QUESTION_POOL.creative
  ];
  shuffle(others);
  for (const q of others) {
    if (selected.length >= n) break;
    if (!usedIds.has(q.id)) { selected.push(q); usedIds.add(q.id); }
  }

  // Number them
  return selected.map((q, i) => ({ ...q, number: i + 1 }));
}

function addMoreQuestions(n = 3) {
  const allUsed = new Set(state.questions.map(q => q.id));
  const pool = [
    ...QUESTION_POOL.felix_review,
    ...QUESTION_POOL.writing_style,
    ...QUESTION_POOL.joel_modeling,
    ...QUESTION_POOL.creative
  ].filter(q => !allUsed.has(q.id));
  shuffle(pool);

  const toAdd = pool.slice(0, n).map((q, i) => ({
    ...q,
    number: state.questions.length + i + 1  }));

  state.questions = [...state.questions, ...toAdd];
  saveState();
  render();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  renderStreak();
  if (state.current >= state.questions.length) {
    showCompletion();
    return;
  }
  renderProgress();
  renderCard(state.questions[state.current]);
}

function renderStreak() {
  const bar = document.getElementById('streakBar');
  const dots = state.questions.map((q, i) => {
    let cls = 'streak-dot';
    if (i < state.current) cls += ' done';
    else if (i === state.current) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  bar.innerHTML = dots + `<span class="streak-label">${state.current}/${state.questions.length} done</span>`;
}

function renderProgress() {
  const pct = Math.round((state.current / state.questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Question ${state.current + 1} of ${state.questions.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.display = 'block';
  document.getElementById('completion').classList.remove('show');
  document.getElementById('cardContainer').style.display = 'block';
}

function renderCard(q) {
  const resp = state.responses[q.id] || {};
  const container = document.getElementById('cardContainer');

  let inputHtml = '';
  if (q.type === 'scale') {
    const s = q.scale;
    const btns = [];
    for (let v = s.min; v <= s.max; v++) {
      const sel = resp.rating === v ? ' selected' : '';
      btns.push(`<button class="scale-btn${sel}" data-v="${v}" onclick="selectScale('${q.id}',${v})">${v}</button>`);
    }
    inputHtml = `
      <div class="scale-container">
        <div class="scale-track">${btns.join('')}</div>
        <div class="scale-labels"><span>${s.labels[String(s.min)]}</span><span>${s.labels[String(s.max)]}</span></div>
      </div>`;
  } else {
    const opts = q.options.map((o, i) => {
      const sel = resp.choice === o ? ' selected' : '';
      return `<button class="option-btn${sel}" onclick="selectOption('${q.id}','${o.replace(/'/g,"\\'")}')">
        <span class="option-num">${i+1}</span><span>${o}</span>
      </button>`;
    }).join('');
    inputHtml = `<div class="options-list">${opts}</div>`;
  }

  const textHtml = q.allow_text ? `
    <div class="text-input-wrap">
      <div class="text-input-label">💬 ${q.text_placeholder || 'Notes (optional)'}</div>
      <textarea placeholder="${q.text_placeholder || 'Add notes...'}" onchange="saveText('${q.id}',this.value)">${resp.text || ''}</textarea>
    </div>` : '';

  const isLast = state.current === state.questions.length - 1;
  const hasResponse = resp.rating || resp.choice;
  const btnLabel = isLast ? 'Finish session →' : 'Next →';

  const badge = {
    felix_review: 'Felix Review',
    writing_style: 'Writing Style',
    joel_modeling: 'Know Joel',
    creative: 'Creative'
  }[q.category] || q.category;

  // Format question text with markdown-like blocks
  let questionHtml = q.question;
  questionHtml = questionHtml.replace(/\n\n> (.*?)(?=\n|$)/g, '<br><blockquote>$1</blockquote>');
  questionHtml = questionHtml.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  questionHtml = questionHtml.replace(/\n/g, '<br>');

  const moreBtn = state.current === state.questions.length - 1 && !state.submitted ?
    `<button class="btn-more" onclick="addMoreQuestions(3)">+ More questions</button>` : '';

  container.innerHTML = `
    <div class="question-card">
      <div class="card-meta">
        <span class="card-emoji">${q.emoji}</span>
        <span class="card-label">${q.label}</span>
        <span class="card-badge">${badge}</span>
      </div>
      <div class="question-text">${questionHtml}</div>
      ${inputHtml}
      ${textHtml}
      <div class="card-actions">
        <button class="btn-skip" onclick="skipQuestion()">Skip</button>
        ${moreBtn}
        <button class="btn-next" id="btnNext" onclick="nextQuestion()" ${hasResponse ? '' : 'disabled'}>
          ${btnLabel}
        </button>
      </div>
    </div>`;
}

// ── INTERACTIONS ────────────────────────────────────────────────────────────
function selectScale(qId, value) {
  if (!state.responses[qId]) state.responses[qId] = {};
  state.responses[qId].rating = value;
  saveState();
  document.getElementById('btnNext').disabled = false;
  // Update button states
  document.querySelectorAll('.scale-btn').forEach(btn => {
    btn.classList.toggle('selected', parseInt(btn.dataset.v) === value);
  });
}

function selectOption(qId, value) {
  if (!state.responses[qId]) state.responses[qId] = {};
  state.responses[qId].choice = value;
  saveState();
  document.getElementById('btnNext').disabled = false;
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.querySelector('span:last-child').textContent === value);
  });
}

function saveText(qId, value) {
  if (!state.responses[qId]) state.responses[qId] = {};
  state.responses[qId].text = value;
  saveState();
}

function nextQuestion() {
  state.current++;
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function skipQuestion() {
  state.current++;
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── COMPLETION ──────────────────────────────────────────────────────────────
function showCompletion() {
  document.getElementById('cardContainer').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
  document.getElementById('completion').classList.add('show');

  const answered = Object.keys(state.responses).length;
  const ratings = Object.values(state.responses)
    .map(r => r.rating)
    .filter(r => r !== undefined);
  const avgRating = ratings.length
    ? (ratings.reduce((a,b) => a+b, 0) / ratings.length).toFixed(1)
    : '—';
  const signals = Object.values(state.responses).filter(r => r.text && r.text.length > 3).length;

  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statAvgRating').textContent = avgRating;
  document.getElementById('statSignals').textContent = signals;

  const subs = [
    "Nice work. Felix gets a little smarter.",
    "Logged. Felix is learning your patterns.",
    "Solid session. Your feedback shapes Felix's rules.",
    "Done. Every session compounds."
  ];
  document.getElementById('completionSub').textContent = subs[Math.floor(Math.random() * subs.length)];

  // Show Telegram main button as primary CTA
  if (tg) {
    tg.MainButton.setText('Apply to Felix →');
    tg.MainButton.show();
    // Hide the in-page button since Telegram button takes over
    document.getElementById('btnSubmit').style.display = 'none';
  }
}

async function submitSession() {
  const btn = document.getElementById('btnSubmit');
  btn.textContent = 'Applying...';
  btn.disabled = true;

  // Save full session to localStorage
  state.submitted = true;
  localStorage.setItem(SESSION_KEY, JSON.stringify(state));

  // Build compact summary
  const answered = Object.keys(state.responses).length;
  const ratings = Object.values(state.responses).map(r => r.rating).filter(r => r != null);
  const avg = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : '?';

  // Build human-readable summary of responses
  const lines = [`TRAINING_SUBMIT:${state.sessionId}`, `Date: ${state.date}`, `Avg rating: ${avg}/10`, ``];
  for (const q of state.questions) {
    const r = state.responses[q.id];
    if (!r) continue;
    const ratingStr = r.rating != null ? `${r.rating}/10` : r.choice || '';
    const noteStr = r.note ? ` — "${r.note}"` : '';
    lines.push(`Q${q.number} [${q.category}]: ${ratingStr}${noteStr}`);
  }
  const summary = lines.join('\n');

  // Option 1: tg.sendData — works when opened from keyboard button
  if (tg) {
    tg.HapticFeedback?.notificationOccurred('success');
    try {
      tg.sendData(summary);
      return; // app closes — done
    } catch(e) { /* fall through */ }
  }

  // Option 2: POST directly to Telegram Bot API (bot sends itself a message)
  // Repo is private so token is not publicly accessible
  const BOT_TOKEN = '8763547695:AAHN8noG0Y5S5rbdAgjRWWkYWBuRLZOwAYs';
  const CHAT_ID = '8699242987';
  try {
    const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: summary,
        // no parse_mode
      })
    });
    const result = await resp.json();
    if (result.ok) {
      btn.textContent = '✓ Applied';
      showToast('✓ Sent to betterAI · Felix gets smarter');
      if (tg) setTimeout(() => tg.close(), 2000);
      return;
    }
  } catch(e) { /* fall through */ }

  // Option 3: show data for manual copy
  btn.textContent = '✓ Session done';
  showToast('✓ Saved locally');

  setTimeout(() => {
    btn.textContent = 'Start new session →';
    btn.disabled = false;
    btn.onclick = () => { localStorage.removeItem(SESSION_KEY); init(); };
  }, 2000);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function saveState() {
  localStorage.setItem(SESSION_KEY, JSON.stringify(state));
}

// ── START ────────────────────────────────────────────────────────────────────
init();
</script>
